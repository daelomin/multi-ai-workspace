[project]
name = "traffic-platform"
version = "0.1.0"
description = "Plateforme nationale de trafic routier — ingestion DATEX II, LRS, cartographie"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
